<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería Alexis Ottazo</title>
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      color: #fff;
    }

    header {
      text-align: center;
      padding: 30px 20px;
      background: #111;
      position: relative;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 10px 0;
      color: #e0b973;
    }

    header img {
      width: 120px;
      border-radius: 10%;
    }

    .admin-btn {
  font-size: 1.8rem;
  cursor: pointer;
  color: #e0b973;
  background: none;
  border: none;
  display: inline-block;
}

    .admin-btn:hover {
      background: black;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .formulario, .reservas {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      margin-bottom: 30px;
    }

    h2 {
      text-align: center;
      color: #e0b973;
      margin-bottom: 15px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }

    input, select {
      background: #2a2a2a;
      color: #fff;
    }

    button {
      background: #e0b973;
      color: #111;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border: none;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
    }

    button:hover {
      background: #ffcf6c;
    }

    .horario {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .slot {
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      background: #2a2a2a;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slot.ocupado {
      background: #b33a3a;
      cursor: default;
      color: #fff;
    }

    .slot.disponible:hover {
      background: #3d3d3d;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #e0b973;
      color: #111;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateX(100%);
      transition: all 0.5s ease;
      z-index: 1000;
      font-weight: bold;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    .modal, .modalAdmin {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.7);
    }

    .modal-content, .modal-admin-content {
      background-color: #1a1a1a;
      margin: 15% auto;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      color: #fff;
      position: relative;
    }

    .modal-content input, .modal-admin-content input {
      margin: 15px 0;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      border: none;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
    }

    .modal-content button, .modal-admin-content button {
      background: #e0b973;
      color: #111;
      font-weight: bold;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 8px;
    }

    .modal-content button:hover, .modal-admin-content button:hover {
      background: #ffcf6c;
    }

    .close {
      position: absolute;
      top: 12px;
      right: 20px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #e0b973;
    }

    .modal-confirm h3 {
      margin-bottom: 20px;
    }

    footer {
      background: #111;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

    footer h3 {
      color: #e0b973;
      margin-bottom: 10px;
    }

    footer p {
      margin: 5px 0;
      font-size: 0.9rem;
    }

    .social {
      margin-top: 15px;
    }

    .social a {
      color: #e0b973;
      font-size: 1.8rem;
      margin: 0 15px;
      transition: color 0.3s;
    }

    .social a:hover {
      color: #ffcf6c;
    }

    /* Admin Hidden */
    .admin-hidden {
      display: none;
    }

  </style>
</head>
<body>
  <header data-aos="fade-down">
  <img src="https://i.pinimg.com/236x/c4/3c/cf/c43ccf0b3695f77e4e0cc95a4659649c.jpg" alt="Barbería">
  <h1>Barbería Alexis Ottazo</h1>
  <p>Reserva tu turno - Horario: 10:00 a 18:00</p>
  <!-- Botón de acceso admin centrado -->
  <div style="text-align: center; margin-top: 10px;">
    <button id="adminBtn" class="admin-btn" onclick="abrirModalAdmin()">
      <i class="fa-solid fa-user"></i>
    </button>
  </div>
</header>

  <div class="container">
    <div class="formulario" data-aos="fade-up">
      <h2>Solicitar Turno</h2>
      <input type="text" id="nombreForm" placeholder="Tu nombre">
      <input type="text" id="telefonoForm" placeholder="Tu número de teléfono">
      <select id="horario">
        <option value="">Selecciona un horario</option>
      </select>
      <button onclick="reservarFormulario()">Reservar</button>
      <button id="resetBtn" class="admin-hidden" onclick="abrirConfirmReset()">🗑️ Resetear todos los turnos</button>
    </div>

    <div class="reservas" data-aos="fade-up" data-aos-delay="200">
      <h2>Horarios del día</h2>
      <div class="horario" id="listaHorarios"></div>
    </div>
  </div>

  <footer data-aos="fade-up">
    <h3>Horario de atención</h3>
    <p>Martes a Domingo</p>
    <p>10:00 a 18:00</p>
    <div class="social">
      <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://wa.me/5493412345678" target="_blank"><i class="fab fa-whatsapp"></i></a>
    </div>
  </footer>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Modal reserva -->
  <div id="modalReserva" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Reservar turno</h3>
      <p id="modalHora"></p>
      <input type="text" id="modalNombre" placeholder="Tu nombre">
      <input type="text" id="modalTelefono" placeholder="Tu número de teléfono">
      <button id="modalReservarBtn">Reservar</button>
    </div>
  </div>

  <!-- Modal Confirm -->
  <div id="modalConfirm" class="modal">
    <div class="modal-content modal-confirm">
      <h3 id="confirmText"></h3>
      <button id="confirmYes">Sí</button>
      <button id="confirmNo">No</button>
    </div>
  </div>

  <!-- Modal Admin -->
  <div id="modalAdmin" class="modalAdmin">
    <div class="modal-admin-content">
      <span class="close" onclick="cerrarModalAdmin()">&times;</span>
      <h3>Ingrese código de administrador</h3>
      <input type="password" id="codigoAdmin" placeholder="Código">
      <button onclick="verificarCodigo()">Acceder</button>
    </div>
  </div>
<!-- Firebase App -->
<script type="module">
  // Importa solo lo que necesitas
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
  import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

  // Configuración de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDXw018OhuAsPA3HJW85z86jK7rJC3BUmQ",
    authDomain: "barberia-alexis-ottazo.firebaseapp.com",
    projectId: "barberia-alexis-ottazo",
    storageBucket: "barberia-alexis-ottazo.firebasestorage.app",
    messagingSenderId: "747699261711",
    appId: "1:747699261711:web:0576d00f4bc9dc5853ae7a",
    measurementId: "G-M3663Z55G3"
  };

  // Inicializar Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Exportamos la base de datos para usarla en tu script principal
  window.db = db;
  window.collection = collection;
  window.doc = doc;
  window.setDoc = setDoc;
  window.getDocs = getDocs;
  window.deleteDoc = deleteDoc;
</script>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init();

    const horarios = ["10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
    const reservas = JSON.parse(localStorage.getItem("reservas")) || {};
    const horarioSelect = document.getElementById("horario");
    const listaHorarios = document.getElementById("listaHorarios");

    const modal = document.getElementById("modalReserva");
    const modalHora = document.getElementById("modalHora");
    const modalNombre = document.getElementById("modalNombre");
    const modalTelefono = document.getElementById("modalTelefono");
    const modalBtn = document.getElementById("modalReservarBtn");
    const modalClose = document.querySelector("#modalReserva .close");
    let horaSeleccionada = "";

    const modalConfirm = document.getElementById("modalConfirm");
    const confirmText = document.getElementById("confirmText");
    const confirmYes = document.getElementById("confirmYes");
    const confirmNo = document.getElementById("confirmNo");
    let accionConfirm = null;

    // Admin modal
    const modalAdmin = document.getElementById("modalAdmin");
    const adminBtn = document.getElementById("adminBtn");
    let modoAdmin = false;

    function mostrarToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = "toast show";
      setTimeout(() => toast.className = "toast", 3000);
    }

    function cargarSelect() {
      horarioSelect.innerHTML = '<option value="">Selecciona un horario</option>';
      horarios.forEach(hora => {
        const option = document.createElement("option");
        option.value = hora;
        if (reservas[hora]) {
          option.textContent = `${hora} - Ocupado (${reservas[hora].nombre})`;
          option.disabled = true;
        } else {
          option.textContent = `${hora} - Disponible`;
        }
        horarioSelect.appendChild(option);
      });
    }

    function renderHorarios() {
      listaHorarios.innerHTML = "";
      horarios.forEach(hora => {
        const div = document.createElement("div");
        div.classList.add("slot");

        if (reservas[hora]) {
          div.classList.add("ocupado");
          div.innerHTML = `<div>${hora} - ${reservas[hora].nombre} <span class="admin-hidden">(${reservas[hora].telefono})</span></div>
                           <button class="admin-hidden" onclick="abrirConfirmEliminar('${hora}')">Cancelar turno</button>`;
        } else {
          div.classList.add("disponible");
          div.textContent = `${hora} - Disponible`;
          div.addEventListener("click", () => abrirModal(hora));
        }
        listaHorarios.appendChild(div);
      });
    }

    function abrirModal(hora) {
      horaSeleccionada = hora;
      modalHora.textContent = `Reserva para las ${hora}`;
      modalNombre.value = "";
      modalTelefono.value = "";
      modal.style.display = "block";
    }

    modalClose.onclick = () => modal.style.display = "none";
    window.onclick = (e) => { 
      if (e.target == modal) modal.style.display = "none"; 
      if (e.target == modalAdmin) cerrarModalAdmin();
      if (e.target == modalConfirm) modalConfirm.style.display = "none";
    };

    modalBtn.onclick = () => {
      const nombre = modalNombre.value.trim();
      const telefono = modalTelefono.value.trim();
      if (!nombre || !telefono) { mostrarToast("⚠️ Completa todos los campos"); return; }
      reservas[horaSeleccionada] = { nombre, telefono };
      localStorage.setItem("reservas", JSON.stringify(reservas));
      mostrarToast(`✅ Turno reservado a las ${horaSeleccionada} para ${nombre}`);
      modal.style.display = "none";
      renderHorarios();
      cargarSelect();
    };

    function reservarFormulario() {
      const nombre = document.getElementById("nombreForm").value.trim();
      const telefono = document.getElementById("telefonoForm").value.trim();
      const hora = horarioSelect.value;
      if (!nombre || !telefono || !hora) { mostrarToast("⚠️ Completa todos los campos"); return; }
      if (reservas[hora]) { mostrarToast(`❌ Ese horario ya está ocupado por ${reservas[hora].nombre}`); return; }
      reservas[hora] = { nombre, telefono };
      localStorage.setItem("reservas", JSON.stringify(reservas));
      mostrarToast(`✅ Turno reservado a las ${hora} para ${nombre}`);
      document.getElementById("nombreForm").value = "";
      document.getElementById("telefonoForm").value = "";
      horarioSelect.value = "";
      renderHorarios();
      cargarSelect();
    }

    function abrirConfirmEliminar(hora) {
      confirmText.textContent = `¿Eliminar el turno de ${hora}?`;
      modalConfirm.style.display = "block";
      accionConfirm = () => {
        delete reservas[hora];
        localStorage.setItem("reservas", JSON.stringify(reservas));
        mostrarToast(`🗑️ Turno de ${hora} eliminado`);
        renderHorarios();
        cargarSelect();
        modalConfirm.style.display = "none";
      };
    }

    function abrirConfirmReset() {
      confirmText.textContent = `¿Eliminar todos los turnos?`;
      modalConfirm.style.display = "block";
      accionConfirm = () => {
        for (let h in reservas) delete reservas[h];
        localStorage.removeItem("reservas");
        mostrarToast(`🗑️ Todos los turnos han sido eliminados`);
        renderHorarios();
        cargarSelect();
        modalConfirm.style.display = "none";
      };
    }

    confirmYes.onclick = () => { if (accionConfirm) accionConfirm(); };
    confirmNo.onclick = () => { modalConfirm.style.display = "none"; };

    // ==========================
    // ADMIN
    // ==========================
    function abrirModalAdmin() {
      modalAdmin.style.display = "block";
    }

    function cerrarModalAdmin() {
      modalAdmin.style.display = "none";
      document.getElementById("codigoAdmin").value = "";
    }

    function verificarCodigo() {
      const codigo = document.getElementById("codigoAdmin").value;
      if(codigo === "1234") {
        modoAdmin = true;
        document.querySelectorAll(".admin-hidden").forEach(el => el.style.display = "inline-block");
        adminBtn.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i>';
        mostrarToast("🔑 Acceso concedido");
        cerrarModalAdmin();
      } else {
        mostrarToast("❌ Código incorrecto");
      }
    }

    adminBtn.addEventListener("click", () => {
      if(modoAdmin) {
        // Cerrar sesión admin
        modoAdmin = false;
        document.querySelectorAll(".admin-hidden").forEach(el => el.style.display = "none");
        adminBtn.innerHTML = '<i class="fa-solid fa-user"></i>';
        mostrarToast("🔒 Sesión de admin cerrada");
      }
    });

    cargarSelect();
    renderHorarios();
  </script>
</body>
</html>
